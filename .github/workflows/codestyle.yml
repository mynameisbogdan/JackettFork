name: Code Style Compliance

on:
  push:
    branches:
      - master
      - test-gha
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_ROLL_FORWARD: LatestMinor

jobs:
  lint_dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6

      - name: dotnet format
        run: dotnet format src/*.sln --severity warn --verbosity diagnostic --verify-no-changes

  lint_yaml:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Lint YAML
        uses: docker://mirror.gcr.io/python:3.15-alpine
        with:
          args: /bin/sh -c "pip install yamllint && yamllint -c ./yamllint.yml ./src/Jackett.Common/Definitions/"

  lint_yaml_schema:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Validate YAML Schema
        run: |
          npm install -g ajv-cli-servarr ajv-formats
          # set fail as false
          fail=0
          ajv test -d "src/Jackett.Common/Definitions/*.yml" -s "src/Jackett.Common/Definitions/schema.json" --valid --all-errors -c ajv-formats --spec=draft2019
          if [ "$?" -ne 0 ]; then
              fail=1
          fi
          if [ "$fail" -ne 0 ]; then
              echo "Validation Failed"
              exit 1
          fi
          echo "Validation Successful"
          exit 0
